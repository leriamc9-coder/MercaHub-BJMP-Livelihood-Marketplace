<style>

round:#f6f8f5;color:var(--muted);font-size:12px}.aside-foot strong{color:var(--ink);display:block;margin-bottom:5px}.main{padding:32px clamp(18px,4vw,56px);max-width:1500px;width:100%;margin:0 auto}.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}.headrow h1{font-size:28px;line-height:1.2;letter-spacing:-.8px;margin:5px 0}.sub{color:var(--muted);margin:0}.button{border:0;border-radius:10px;padding:10px 15px;font-weight:750;background:var(--green);color:white;box-shadow:0 4px 10px #176b4a20}.button:hover{background:#105b3d}.button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.button.soft{background:var(--mint);color:var(--green);box-shadow:none}.button.danger{background:#fff0ee;color:var(--red);box-shadow:none}.button.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #17251e05}.stat{position:relative;overflow:hidden}.stat .stat-icon{float:right;width:36px;height:36px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:17px}.stat .label{color:var(--muted);font-weight:650;font-size:12px}.stat .value{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:9px 0 2px}.stat .trend{font-size:11px;color:var(--green);font-weight:700}.two-col{grid-template-columns:1.5fr 1fr}.card-title{font-weight:800;font-size:15px;margin:0}.card-meta{font-size:12px;color:var(--muted);margin-top:3px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.chart{height:220px;display:flex;align-items:end;gap:12px;padding:18px 5px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 52px,#eef2ee 53px,#eef2ee 54px)}.bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(32px,65%);border-radius:7px 7px 2px 2px;background:#b9dfc9;min-height:9px;position:relative}.bar.active{background:var(--green2)}.bar-col span{font-size:10px;color:var(--muted)}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f0f3f0}.row:last-child{border:0}.product-mini{display:flex;align-items:center;gap:10px}.thumb{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:#f4ead9}.thumb.t2{background:#e6f0e6}.thumb.t3{background:#f6e6e3}.thumb.t4{background:#e6edf6}.product-mini strong{display:block;font-size:12px}.product-mini small{color:var(--muted);font-size:11px}.price{font-weight:800}.status{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800;background:#e7f5eb;color:#297746;white-space:nowrap}.status.pending{background:#fff4df;color:#a56a07}.status.cancelled,.status.rejected{background:#ffedeb;color:#b64b42}.status.refunded{background:#e9effa;color:#456b9e}.status.processing{background:#eaf1fb;color:#4773a5}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;min-width:220px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#72b994;box-shadow:0 0 0 3px #23875f15;outline:none}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:#8b9991;font-size:10px;text-transform:uppercase;letter-spacing:.75px;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0f3f0;font-size:12px}tr:last-child td{border-bottom:0}td strong{font-size:12px}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product-card{overflow:hidden;padding:0}.product-art{height:142px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#f3ead8,#efe2c9)}.product-art.green{background:linear-gradient(135deg,#e5f0e2,#cee4d1)}.product-art.rose{background:linear-gradient(135deg,#f5e3de,#f0d1c9)}.product-art.blue{background:linear-gradient(135deg,#e4edf6,#cfdceb)}.product-info{padding:15px}.product-info h3{margin:0;font-size:14px}.product-info p{color:var(--muted);font-size:11px;margin:5px 0 12px}.product-foot{display:flex;justify-content:space-between;align-items:center}.price-large{font-size:16px;font-weight:850}.qty{font-size:10px;color:var(--muted)}.progress{height:8px;border-radius:99px;background:#edf1ed;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;border-radius:99px;background:var(--green2)}.empty{padding:42px;text-align:center;color:var(--muted)}.panel{display:none}.panel.active{display:block}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.filters select,.field select,.field input,.field textarea{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 11px;color:var(--ink);width:100%}.filters select{width:auto}.pill{border:1px solid var(--line);border-radius:99px;background:#fff;padding:8px 12px;color:#68776f;font-weight:700;font-size:11px}.pill.active{background:var(--green);color:#fff;border-color:var(--green)}.modal-backdrop{position:fixed;inset:0;background:#17251e75;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0003}.modal h2{font-size:19px;margin:0 0 4px}.modal p{font-size:12px;color:var(--muted);margin:0 0 18px}.modal-top{display:flex;justify-content:space-between;align-items:start}.close{border:0;background:#f1f4f1;border-radius:9px;width:32px;height:32px;font-size:18px}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:11px;font-weight:750;color:#58665e}.modal-actions{display:flex;justify-content:end;gap:8px;margin-top:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.notice{padding:13px 14px;background:#f3f8f4;border:1px solid #e0eee4;border-radius:12px;color:#50665a;font-size:12px;margin-bottom:14px}.notice strong{color:var(--green)}.login-wrap{max-width:510px;margin:20px auto}.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}.login-card{padding:28px}.login-card h2{font-size:23px;margin:0 0 5px}.login-card>p{margin:0 0 22px;color:var(--muted)}.login-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f5f2;border-radius:10px;padding:4px;margin-bottom:17px}.login-tabs button{border:0;border-radius:8px;padding:9px;background:transparent;color:var(--muted);font-weight:750}.login-tabs button.active{background:white;color:var(--green);box-shadow:0 1px 5px #17251e12}.customer-shell{max-width:1200px;margin:auto}.customer-nav{display:flex;align-items:center;gap:20px}.customer-nav a{color:#66756d;text-decoration:none;font-weight:650;cursor:pointer}.hero{border-radius:20px;padding:42px;background:linear-gradient(115deg,#174e37,#247851);color:#fff;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;overflow:hidden;position:relative}.hero h2{font-size:32px;line-height:1.15;letter-spacing:-.8px;margin:0 0 12px}.hero p{color:#d8eee0;max-width:470px;margin:0 0 20px}.hero-art{font-size:115px;text-align:center;filter:drop-shadow(0 15px 15px #102e2050)}.category-strip{display:flex;gap:8px;overflow:auto;padding:18px 0}.customer-products{grid-template-columns:repeat(4,minmax(0,1fr))}.toast{position:fixed;bottom:22px;right:22px;background:#15271e;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);transform:translateY(90px);opacity:0;transition:.25s;z-index:90}.toast.show{transform:translateY(0);opacity:1}.cart-badge{background:var(--green);color:#fff;border-radius:99px;padding:2px 7px;font-size:10px;margin-left:4px}.small-note{color:var(--muted);font-size:11px}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}.moneyline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eff2ef}.moneyline:last-child{border:0}.moneyline.total{font-weight:850;font-size:16px}.report-kpis{grid-template-columns:repeat(3,1fr)}.report-block{margin-top:16px}.mobile-overlay{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.product-grid{grid-template-columns:repeat(2,1fr)}.customer-products{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}
@media(max-width:720px){.topbar{padding:0 16px;height:62px}.layout{grid-template-columns:1fr}.layout aside{display:none;position:fixed;z-index:30;top:62px;left:0;bottom:0;width:270px;box-shadow:var(--shadow)}.layout.menu-open aside{display:block}.mobile-menu{display:block}.top-actions .user-chip{display:none}.main{padding:23px 16px}.headrow h1{font-size:23px}.headrow{align-items:center}.hero{padding:27px 23px;grid-template-columns:1fr}.hero h2{font-size:27px}.hero-art{display:none}.customer-nav{gap:10px}.customer-nav a:not(.show-mobile){display:none}.stats{gap:10px}.stat{padding:14px}.stat .value{font-size:22px}.product-grid,.customer-products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-art{height:108px;font-size:44px}.search{min-width:150px;flex:1}.form-grid{grid-template-columns:1fr}.report-kpis{grid-template-columns:1fr}.top-actions{gap:7px}.role-select{font-size:11px;padding:8px}}
@media(max-width:410px){.product-grid,.customer-products{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.card{padding:14px}}
</style>

<body>
<div class="app" id="app"></div><div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const seedProducts=[
{id:1,name:'Handwoven Market Tote',category:'Bags & Crafts',price:420,stock:18,sold:32,emoji:'👜',tone:'',desc:'A sturdy, reusable tote crafted through the BJMP livelihood program.'},
{id:2,name:'Wooden Desk Organizer',category:'Home & Living',price:350,stock:11,sold:25,emoji:'🪵',tone:'green',desc:'Hand-finished organizer for a tidy desk or study table.'},
{id:3,name:'Beaded Keychain Set',category:'Accessories',price:120,stock:35,sold:41,emoji:'🧵',tone:'rose',desc:'Colorful handmade keychains, made in small batches.'},
{id:4,name:'Native Table Runner',category:'Home & Living',price:580,stock:7,sold:17,emoji:'🧶',tone:'blue',desc:'A woven table accent featuring traditional patterns.'},
{id:5,name:'Hand-painted Planter',category:'Home & Living',price:260,stock:14,sold:19,emoji:'🪴',tone:'green',desc:'A cheerful planter decorated by participating PDL artisans.'},
{id:6,name:'Gift Box Collection',category:'Gifts',price:690,stock:5,sold:12,emoji:'🎁',tone:'',desc:'A curated gift box featuring selected livelihood products.'}
];
const seedOrders=[
{id:'MH-1048',customer:'Maria Santos',items:'2 × Market Tote',total:840,date:'Oct 01, 2026',status:'Processing',payment:'GCash'},
{id:'MH-1047',customer:'Joel Reyes',items:'1 × Desk Organizer',total:350,date:'Sep 30, 2026',status:'Pending',payment:'Cash on pickup'},
{id:'MH-1046',customer:'Ana Cruz',items:'1 × Gift Box Collection',total:690,date:'Sep 30, 2026',status:'Completed',payment:'Bank transfer'},
{id:'MH-1045',customer:'Rina Dela Cruz',items:'3 × Beaded Keychain Set',total:360,date:'Sep 29, 2026',status:'Cancelled',payment:'GCash'},
{id:'MH-1044',customer:'Paolo Garcia',items:'1 × Table Runner',total:580,date:'Sep 28, 2026',status:'Completed',payment:'Cash on pickup'}
];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('mh_'+k))??d}catch(e){return d}};
let products=load('products',seedProducts),orders=load('orders',seedOrders),refunds=load('refunds',[{id:'RF-209',order:'MH-1045',customer:'Rina Dela Cruz',amount:360,reason:'Order cancelled before fulfillment',status:'Pending',date:'Sep 29, 2026'}]);
let cart=load('cart',[]),role=load('role','bjmp'),page=load('page','dashboard'),customerTab='shop',productFilter='All';
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH');const save=()=>{localStorage.setItem('mh_products',JSON.stringify(products));localStorage.setItem('mh_orders',JSON.stringify(orders));localStorage.setItem('mh_refunds',JSON.stringify(refunds));localStorage.setItem('mh_cart',JSON.stringify(cart));localStorage.setItem('mh_role',role);localStorage.setItem('mh_page',page)};
const navItems=[['dashboard','▦','Dashboard'],['products','▣','Product Management'],['monitoring','◉','BJMP Monitoring'],['sales','↗','Sales Tracking'],['orders','▤','Order Management'],['cancellations','↩','Cancellations'],['refunds','◌','Refund Management'],['finance','₱','Financial Monitoring'],['reports','▥','Reports']];
function showToast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function status(s){let cl=s.toLowerCase().replaceAll(' ','-');return `<span class="status ${cl}">${s}</span>`}
function fmtDate(s){return s||new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'})}
function go(p){page=p;save();render();document.querySelector('.layout')?.classList.remove('menu-open')}
function setRole(r){role=r;page=r==='customer'?'shop':'dashboard';save();render()}
function header(){return `<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" onclick="document.querySelector('.layout')?.classList.toggle('menu-open')">☰</button><div class="brand"><div class="brandmark">M</div><div>MercaHub<small>BJMP LIVELIHOOD MARKETPLACE</small></div></div></div><div class="top-actions"><select class="role-select" aria-label="Choose view" onchange="setRole(this.value)"><option value="bjmp" ${role==='bjmp'?'selected':''}>BJMP Staff View</option><option value="customer" ${role==='customer'?'selected':''}>Customer View</option></select><div class="user-chip">${role==='customer'?'👤 Customer':'🛡️ BJMP Staff'}</div></div></header>`}
function sidebar(){return `<aside><div class="side-label">Workspace</div><div class="nav">${navItems.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}</div><div class="side-label" style="margin-top:24px">Customer Portal</div><div class="nav"><button class="${page==='shop'?'active':''}" onclick="setRole('customer')"><span class="ico">⌂</span>Marketplace</button><button onclick="openLogin()"><span class="ico">♙</span>Customer Login</button></div><div class="aside-foot"><strong>Prototype Mode</strong>Sample data is stored in this browser. Sign-in and transactions are demonstrations.</div></aside>`}
function shell(content){return `${header()}<div class="layout">${sidebar()}<main class="main">${content}</main></div>`}
function pageHead(kicker,title,sub,action=''){return `<div class="headrow"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function metric(label,value,icon,trend){return `<div class="card stat"><span class="stat-icon">${icon}</span><div class="label">${label}</div><div class="value">${value}</div><div class="trend">${trend}</div></div>`}
function dashboard(){let total=orders.filter(o=>o.status==='Completed').reduce((a,o)=>a+o.total,0);return pageHead('BJMP workspace','Good morning, team 👋','Here’s the latest activity across your livelihood marketplace.',`<button class="button" onclick="go('products')">＋ Add product</button>`)+`<div class="grid stats">${metric('Net sales this month',peso(total), '₱','↑ 8.4% from last month')}${metric('Orders received',orders.length,'▤','2 orders need attention')}${metric('Products listed',products.length,'▣','Across 4 product categories')}${metric('Refunds to review',refunds.filter(x=>x.status==='Pending').length,'↩','Review pending requests')}</div><div class="grid two-col"><section class="card"><div class="card-head"><div><h3 class="card-title">Sales overview</h3><div class="card-meta">Completed order value · sample monthly view</div></div><select class="role-select" style="padding:7px" onchange="showToast('Showing '+this.value+' sales')"><option>Last 7 months</option><option>This year</option></select></div><div class="chart">${[['Apr',38],['May',55],['Jun',47],['Jul',65],['Aug',58],['Sep',77],['Oct',90]].map((x,i)=>`<div class="bar-col"><div class="bar ${i===6?'active':''}" style="height:${x[1]}%" title="${peso(x[1]*500)}"></div><span>${x[0]}</span></div>`).join('')}</div></section><section class="card"><div class="card-head"><div><h3 class="card-title">Order status</h3><div class="card-meta">Current sample order mix</div></div><button class="button secondary small" onclick="go('orders')">View orders</button></div><div class="list">${[['Pending',orders.filter(o=>o.status==='Pending').length],['Processing',orders.filter(o=>o.status==='Processing').length],['Completed',orders.filter(o=>o.status==='Completed').length],['Cancelled',orders.filter(o=>o.status==='Cancelled').length]].map(([n,c])=>`<div class="row"><span>${n}</span><strong>${c}</strong></div>`).join('')}</div><div class="notice" style="margin:14px 0 0"><strong>Next step:</strong> Check stock and order requests before confirming fulfillment.</div></section></div><section class="card" style="margin-top:16px"><div class="card-head"><div><h3 class="card-title">Recent orders</h3><div class="card-meta">Most recent marketplace activity</div></div><button class="button secondary small" onclick="go('orders')">See all</button></div>${orderTable(orders.slice(0,4),false)}</section>`}
function orderTable(rows,allow=true){if(!rows.length)return `<div class="empty">No matching orders found.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Date</th><th>Total</th><th>Status</th>${allow?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(o=>`<tr><td><strong>${o.id}</strong></td><td>${o.customer}</td><td>${o.items}</td><td>${o.date}</td><td><strong>${peso(o.total)}</strong></td><td>${status(o.status)}</td>${allow?`<td><button class="button secondary small" onclick="orderAction('${o.id}')">Manage</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function productCard(p,customer=false){return `<div class="card product-card"><div class="product-art ${p.tone||''}">${p.emoji||'📦'}</div><div class="product-info"><div class="split"><span class="eyebrow" style="font-size:9px">${p.category}</span>${customer?'':`<span class="qty">${p.stock} in stock</span>`}</div><h3>${p.name}</h3><p>${p.desc||'Handmade BJMP livelihood product.'}</p><div class="product-foot"><span class="price-large">${peso(p.price)}</span>${customer?`<button class="button small" onclick="addCart(${p.id})">Add to cart</button>`:`<button class="button secondary small" onclick="editProduct(${p.id})">Edit</button>`}</div></div></div>`}
function productsPage(){return pageHead('Catalog administration','Product management','Add products, update prices, and keep inventory information current.',`<button class="button" onclick="editProduct()">＋ Add product</button>`)+`<div class="filters"><input class="search" placeholder="Search products…" oninput="filterProducts(this.value)"><select onchange="filterCategory(this.value)"><option>All categories</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${c}</option>`).join('')}</select><span class="small-note">${products.length} products</span></div><div class="grid product-grid" id="productsGrid">${products.map(p=>productCard(p)).join('')}</div>`}
function monitoring(){let low=products.filter(p=>p.stock<10);return pageHead('Program overview','BJMP livelihood monitoring','Monitor product availability, sales activity, and program records in one place.',`<button class="button secondary" onclick="go('reports')">▥ View reports</button>`)+`<div class="grid stats">${metric('Active products',products.length,'▣','Available in marketplace')}${metric('Units in stock',products.reduce((a,p)=>a+p.stock,0),'◉','Across all product listings')}${metric('Units sold',products.reduce((a,p)=>a+p.sold,0),'↗','Based on demo product records')}${metric('Low-stock items',low.length,'⚠','Items with fewer than 10 units')}</div><div class="grid two-col"><section class="card"><div class="card-head"><div><h3 class="card-title">Product and inventory monitoring</h3><div class="card-meta">Track recorded stock and sales by product</div></div><button class="button secondary small" onclick="go('products')">Manage products</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th><th>Units sold</th><th>Stock level</th><th>Indicator</th></tr></thead><tbody>${products.map(p=>`<tr><td><div class="product-mini"><div class="thumb">${p.emoji}</div><strong>${p.name}</strong></div></td><td>${p.stock}</td><td>${p.sold}</td><td style="min-width:120px"><div class="progress"><span style="width:${Math.min(100,p.stock*4)}%"></span></div></td><td>${p.stock<10?'<span class="status pending">Low stock</span>':'<span class="status">Available</span>'}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="card-head"><div><h3 class="card-title">Operational checklist</h3><div class="card-meta">Useful checks for authorized BJMP users</div></div></div><div class="list"><div class="row"><span>Orders awaiting action</span><strong>${orders.filter(o=>['Pending','Processing'].includes(o.status)).length}</strong></div><div class="row"><span>Cancellation records</span><strong>${orders.filter(o=>o.status==='Cancelled').length}</strong></div><div class="row"><span>Refunds pending review</span><strong>${refunds.filter(r=>r.status==='Pending').length}</strong></div></div><div class="notice" style="margin-top:16px"><strong>Monitoring note:</strong> Product and financial figures here are sample records for the interactive prototype. Actual PDL and program data should only be entered by authorized personnel.</div></section></div>`}
function sales(){let completed=orders.filter(o=>o.status==='Completed');return pageHead('Transactions','Sales tracking','Review completed sales, order values, and payment records.',`<button class="button secondary" onclick="go('reports')">Export / reports</button>`)+`<div class="grid stats">${metric('Recorded sales',peso(completed.reduce((a,o)=>a+o.total,0)),'₱','From completed demo orders')}${metric('Completed orders',completed.length,'✓','Marked fulfilled')}${metric('Average order value',peso(completed.length?Math.round(completed.reduce((a,o)=>a+o.total,0)/completed.length):0),'↗','Per completed order')}${metric('Products sold',products.reduce((a,p)=>a+p.sold,0),'▣','Recorded units sold')}</div><section class="card"><div class="card-head"><div><h3 class="card-title">Sales transactions</h3><div class="card-meta">Only completed orders are included in recorded sales</div></div><input class="search" placeholder="Search order or customer…" oninput="filterTable(this.value,'salesTable')"></div><div id="salesTable">${orderTable(completed,false)}</div></section>`}
function ordersPage(){return pageHead('Fulfillment','Order management','Review customer orders and update their fulfillment status.',`<button class="button secondary" onclick="showToast('Order list is up to date')">↻ Refresh</button>`)+`<div class="filters">${['All','Pending','Processing','Completed','Cancelled'].map((x,i)=>`<button class="pill ${i===0?'active':''}" onclick="orderFilter('${x}',this)">${x}</button>`).join('')}<input class="search" placeholder="Search orders…" oninput="filterTable(this.value,'ordersTable')"></div><section class="card"><div id="ordersTable">${orderTable(orders,true)}</div></section>`}
function cancelPage(){let rows=orders.filter(o=>o.status==='Cancelled');return pageHead('Order exceptions','Cancellations','Review cancellation records and keep the reason and refund status traceable.')+`<div class="grid stats">${metric('Cancelled orders',rows.length,'↩','Recorded cancellation requests')}${metric('Value cancelled',peso(rows.reduce((a,o)=>a+o.total,0)),'₱','Excludes completed sales')}${metric('Refund requests',refunds.length,'◌','Linked to cancelled or returned orders')}${metric('Awaiting action',refunds.filter(r=>r.status==='Pending').length,'!','Refund requests requiring review')}</div><section class="card"><div class="card-head"><div><h3 class="card-title">Cancellation records</h3><div class="card-meta">Customer requests and staff-recorded cancellation actions</div></div></div>${orderTable(rows,true)}<div class="notice" style="margin:14px 0 0">Cancelling an order updates its status. A refund is a separate review and recording step.</div></section>`}
function refundsPage(){return pageHead('After-sales','Refund management','Review refund requests and record approval or rejection decisions.')+`<div class="notice"><strong>Sample workflow:</strong> Open a request, check the linked cancelled order, then record a decision. This prototype does not transfer or return real money.</div><section class="card"><div class="card-head"><div><h3 class="card-title">Refund requests</h3><div class="card-meta">${refunds.length} recorded request${refunds.length===1?'':'s'}</div></div></div>${refunds.length?`<div class="table-wrap"><table><thead><tr><th>Request</th><th>Order</th><th>Customer</th><th>Reason</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>${refunds.map(r=>`<tr><td><strong>${r.id}</strong></td><td>${r.order}</td><td>${r.customer}</td><td>${r.reason}</td><td><strong>${peso(r.amount)}</strong></td><td>${r.date}</td><td>${status(r.status)}</td><td>${r.status==='Pending'?`<button class="button secondary small" onclick="refundAction('${r.id}')">Review</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No refund requests yet.</div>'}</section>`}
function finance(){let gross=orders.filter(o=>o.status==='Completed').reduce((a,o)=>a+o.total,0),ref=refunds.filter(r=>r.status==='Approved').reduce((a,r)=>a+r.amount,0);return pageHead('Financial overview','Financial monitoring','See recorded sales, approved refunds, and net sales from sample marketplace records.')+`<div class="grid stats">${metric('Gross completed sales',peso(gross),'₱','Completed orders only')}${metric('Approved refunds',peso(ref),'↩','Approved refund records')}${metric('Net sales',peso(gross-ref),'↗','Gross sales less approved refunds')}${metric('Pending refund value',peso(refunds.filter(r=>r.status==='Pending').reduce((a,r)=>a+r.amount,0)),'◌','Not yet deducted from net sales')}</div><div class="grid two-col"><section class="card"><div class="card-head"><div><h3 class="card-title">Sales reconciliation</h3><div class="card-meta">Demonstration summary</div></div></div><div class="moneyline"><span>Gross sales from completed orders</span><strong>${peso(gross)}</strong></div><div class="moneyline"><span>Less: approved refunds</span><strong>− ${peso(ref)}</strong></div><div class="moneyline total"><span>Net sales</span><strong>${peso(gross-ref)}</strong></div><p class="small-note">This is a basic marketplace monitoring summary, not a complete accounting statement.</p></section><section class="card"><div class="card-head"><div><h3 class="card-title">Payment methods</h3><div class="card-meta">Payment labels on sample orders</div></div></div>${['GCash','Cash on pickup','Bank transfer'].map(m=>{let n=orders.filter(o=>o.status==='Completed'&&o.payment===m).reduce((a,o)=>a+o.total,0);return `<div class="row"><span>${m}</span><strong>${peso(n)}</strong></div>`}).join('')}</section></div><div class="notice" style="margin-top:16px">For actual use, authorized staff should validate how payments, refunds, receipts, and financial records are handled under BJMP policies and applicable procedures.</div>`}
function reports(){let done=orders.filter(o=>o.status==='Completed'),total=done.reduce((a,o)=>a+o.total,0);return pageHead('Insights & exports','Reports','Summarize sales, orders, cancellations, refunds, and product activity.',`<button class="button" onclick="downloadReport()">↓ Download CSV</button>`)+`<div class="grid report-kpis">${metric('Sales transactions',done.length,'▤','Completed orders')}${metric('Sales value',peso(total),'₱','Completed order value')}${metric('Cancellations',orders.filter(o=>o.status==='Cancelled').length,'↩','All recorded cancellations')}</div><div class="grid two-col report-block"><section class="card"><div class="card-head"><div><h3 class="card-title">Product performance</h3><div class="card-meta">Units sold and remaining stock</div></div></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Units sold</th><th>Stock</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>${p.sold}</td><td>${p.stock}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="card-head"><div><h3 class="card-title">Order summary</h3><div class="card-meta">Current order status counts</div></div></div>${['Pending','Processing','Completed','Cancelled'].map(s=>`<div class="row"><span>${s}</span><strong>${orders.filter(o=>o.status===s).length}</strong></div>`).join('')}<div class="row"><span>Refunds approved</span><strong>${refunds.filter(r=>r.status==='Approved').length}</strong></div></section></div><p class="small-note" style="margin-top:14px">Reports are generated from the prototype’s browser data. For study demonstration only.</p>`}
function customer(){if(customerTab==='login')return loginContent();if(customerTab==='orders')return customerOrders();if(customerTab==='cart')return cartPage();return shopPage()}
function customerHeader(){return `<header class="topbar"><div class="brand"><div class="brandmark">M</div><div>MercaHub<small>SHOP BJMP LIVELIHOOD PRODUCTS</small></div></div><nav class="customer-nav"><a onclick="customerTab='shop';render()">Marketplace</a><a onclick="customerTab='orders';render()">My orders</a><a onclick="customerTab='login';render()">Log in</a><button class="button soft" onclick="customerTab='cart';render()">🛒 Cart <span class="cart-badge">${cart.reduce((a,i)=>a+i.qty,0)}</span></button></nav></header>`}
function customerFrame(c){return customerHeader()+`<main class="main customer-shell">${c}<footer style="margin-top:35px;padding:20px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px"><span>© 2026 MercaHub · BJMP Livelihood Marketplace</span><a onclick="setRole('bjmp')" style="cursor:pointer;color:var(--green)">BJMP staff portal →</a></footer></main>`}
function shopPage(){let categories=['All','Bags & Crafts','Home & Living','Accessories','Gifts'];let shown=products.filter(p=>productFilter==='All'||p.category===productFilter);return customerFrame(`<section class="hero"><div><div class="eyebrow" style="color:#bfe7ce">Made with purpose</div><h2>Thoughtful finds.<br>Meaningful impact.</h2><p>Explore handmade livelihood products created through BJMP programs. Every item has a story behind it.</p><button class="button" style="background:#fff;color:var(--green)" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Explore products ↓</button></div><div class="hero-art">🧺🪴</div></section><div class="split" style="margin-top:27px" id="catalog"><div><div class="eyebrow">Shop the collection</div><h2 style="margin:4px 0;font-size:23px">Marketplace products</h2></div><input class="search" placeholder="Search products…" oninput="customerSearch(this.value)"></div><div class="category-strip">${categories.map(c=>`<button class="pill ${productFilter===c?'active':''}" onclick="productFilter='${c}';render()">${c}</button>`).join('')}</div><div class="grid customer-products" id="customerProducts">${shown.map(p=>productCard(p,true)).join('')}</div>${shown.length?'':'<div class="empty">No products in this category yet.</div>'}`)}
function customerSearch(q){let el=document.getElementById('customerProducts');if(!el)return;let shown=products.filter(p=>(productFilter==='All'||p.category===productFilter)&&`${p.name} ${p.category}`.toLowerCase().includes(q.toLowerCase()));el.innerHTML=shown.map(p=>productCard(p,true)).join('')||'<div class="empty">No matching products found.</div>'}
function addCart(id){let item=cart.find(i=>i.id===id);if(item)item.qty++;else cart.push({id,qty:1});save();showToast('Added to your cart');render()}
function cartPage(){let lines=cart.map(i=>({...i,p:products.find(p=>p.id===i.id)})).filter(i=>i.p);let sum=lines.reduce((a,i)=>a+i.p.price*i.qty,0);return customerFrame(`${pageHead('Your selection','Shopping cart','Review your items before placing a sample order.')}<section class="card">${lines.length?lines.map(i=>`<div class="row"><div class="product-mini"><div class="thumb">${i.p.emoji}</div><div><strong>${i.p.name}</strong><small>${peso(i.p.price)} each</small></div></div><div class="toolbar"><button class="button secondary small" onclick="changeQty(${i.id},-1)">−</button><strong>${i.qty}</strong><button class="button secondary small" onclick="changeQty(${i.id},1)">＋</button><strong style="margin-left:10px">${peso(i.p.price*i.qty)}</strong><button class="button danger small" onclick="removeCart(${i.id})">Remove</button></div></div>`).join('')+`<div class="moneyline total" style="margin-top:12px"><span>Order total</span><strong>${peso(sum)}</strong></div><div class="split" style="margin-top:16px"><button class="button secondary" onclick="customerTab='shop';render()">Continue shopping</button><button class="button" onclick="checkout()">Place sample order</button></div>`:'<div class="empty"><div style="font-size:34px">🛒</div>Your cart is empty.<br><button class="button" style="margin-top:14px" onclick="customerTab=\'shop\';render()">Browse products</button></div>'}</section><p class="small-note" style="margin-top:10px">Checkout is a demonstration and does not collect payment or personal information.</p>`)}
function changeQty(id,d){let i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<1)cart=cart.filter(x=>x.id!==id);save();render()}function removeCart(id){cart=cart.filter(x=>x.id!==id);save();render()}
function checkout(){if(!cart.length)return;let items=cart.map(i=>`${i.qty} × ${products.find(p=>p.id===i.id)?.name}`).join(', '),total=cart.reduce((a,i)=>a+(products.find(p=>p.id===i.id)?.price||0)*i.qty,0),id='MH-'+(1049+orders.length);orders.unshift({id,customer:'Guest Customer',items,total,date:fmtDate(),status:'Pending',payment:'Cash on pickup'});cart=[];save();customerTab='orders';showToast('Sample order placed: '+id);render()}
function customerOrders(){let mine=orders.filter(o=>o.customer==='Guest Customer'||o.customer==='Maria Santos');return customerFrame(`${pageHead('Customer account','My orders','Track your order status and submit eligible cancellation requests.')}<section class="card">${mine.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Items</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>${mine.map(o=>`<tr><td><strong>${o.id}</strong></td><td>${o.items}</td><td>${o.date}</td><td>${peso(o.total)}</td><td>${status(o.status)}</td><td>${['Pending','Processing'].includes(o.status)?`<button class="button danger small" onclick="cancelByCustomer('${o.id}')">Cancel request</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No orders are linked to this demo customer yet.<br><button class="button" style="margin-top:12px" onclick="customerTab=\'shop\';render()">Browse products</button></div>'}</section><p class="small-note" style="margin-top:10px">In a real deployment, customers would only see orders linked to their verified account.</p>`)}
function cancelByCustomer(id){let o=orders.find(x=>x.id===id);if(!o||!['Pending','Processing'].includes(o.status))return showToast('This order is not eligible for cancellation.');if(confirm('Submit a cancellation request for '+id+'?')){o.status='Cancelled';refunds.unshift({id:'RF-'+(210+refunds.length),order:o.id,customer:o.customer,amount:o.total,reason:'Customer requested order cancellation',status:'Pending',date:fmtDate()});save();render();showToast('Cancellation recorded. Refund requires review.') }}
function loginContent(){return customerFrame(`<div class="login-wrap"><div class="login-brand"><div class="brandmark">M</div><div><strong>MercaHub</strong><div class="small-note">Customer account</div></div></div><section class="card login-card"><h2>Welcome back</h2><p>Log in to check your orders and manage your account.</p><div class="login-tabs"><button class="active" onclick="this.classList.add('active');this.nextElementSibling.classList.remove('active')">Customer</button><button onclick="setRole('bjmp')">BJMP staff</button></div><form onsubmit="event.preventDefault();showToast('Demo sign-in only — account authentication is not connected.');"><div class="field"><label>Email address</label><input type="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input type="password" placeholder="Enter your password" required></div><div class="split" style="margin:13px 0"><label class="small-note"><input type="checkbox"> Remember me</label><a style="font-size:11px;color:var(--green);cursor:pointer" onclick="showToast('Password recovery is not connected in this prototype.')">Forgot password?</a></div><button class="button" style="width:100%">Log in</button></form><div style="text-align:center;margin-top:18px;font-size:12px;color:var(--muted)">New to MercaHub? <a onclick="showToast('Account registration is a prototype placeholder.')" style="color:var(--green);font-weight:750;cursor:pointer">Create account</a></div></section><div class="notice" style="margin-top:14px">Demo login page: no credentials are saved or verified. For the prototype, use the view selector to switch between Customer and BJMP Staff.</div></div>`)}
function editProduct(id){let p=id?products.find(x=>x.id===id):null;openModal(`<div class="modal-top"><div><h2>${p?'Edit product':'Add a product'}</h2><p>Product details shown in the customer marketplace.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProduct(event,${id||'null'})"><div class="field"><label>Product name</label><input name="name" value="${p?.name||''}" required placeholder="e.g. Handmade tote bag"></div><div class="form-grid"><div class="field"><label>Category</label><select name="category"><option>${p?.category||'Bags & Crafts'}</option>${['Bags & Crafts','Home & Living','Accessories','Gifts'].filter(c=>c!==p?.category).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Price (₱)</label><input name="price" type="number" min="1" value="${p?.price||''}" required></div><div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" value="${p?.stock||0}" required></div><div class="field"><label>Product icon</label><select name="emoji">${['👜','🪵','🧵','🧶','🪴','🎁','🧺','🕯️'].map(e=>`<option ${p?.emoji===e?'selected':''}>${e}</option>`).join('')}</select></div></div><div class="field"><label>Short description</label><textarea name="desc" rows="3" placeholder="Describe the item">${p?.desc||''}</textarea></div><div class="modal-actions"><button type="button" class="button secondary" onclick="closeModal()">Cancel</button><button class="button">Save product</button></div></form>`)}
function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),data={name:f.get('name'),category:f.get('category'),price:+f.get('price'),stock:+f.get('stock'),emoji:f.get('emoji'),desc:f.get('desc'),tone:''};if(id){Object.assign(products.find(p=>p.id===id),data)}else products.unshift({id:Date.now(),sold:0,...data});save();closeModal();render();showToast(id?'Product updated':'Product added')}
function orderAction(id){let o=orders.find(x=>x.id===id);if(!o)return;let options=['Pending','Processing','Completed','Cancelled'];openModal(`<div class="modal-top"><div><h2>Manage ${o.id}</h2><p>${o.customer} · ${o.items} · ${peso(o.total)}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">Current status: ${status(o.status)}<br>Payment method: <strong>${o.payment}</strong></div><div class="field"><label>Update status</label><select id="newStatus">${options.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Cancellation reason (if cancelling)</label><select id="cancelReason"><option>Customer requested cancellation</option><option>Item unavailable</option><option>Duplicate order</option><option>Other</option></select></div><div class="modal-actions"><button class="button secondary" onclick="closeModal()">Close</button><button class="button" onclick="updateOrder('${id}')">Save update</button></div>`)}
function updateOrder(id){let o=orders.find(x=>x.id===id),prev=o.status,next=document.getElementById('newStatus').value;if(next==='Cancelled'&&prev!=='Cancelled'){let reason=document.getElementById('cancelReason').value;o.status=next;refunds.unshift({id:'RF-'+(210+refunds.length),order:o.id,customer:o.customer,amount:o.total,reason,status:'Pending',date:fmtDate()})}else o.status=next;save();closeModal();render();showToast('Order status updated')}
function refundAction(id){let r=refunds.find(x=>x.id===id);openModal(`<div class="modal-top"><div><h2>Review refund ${r.id}</h2><p>Linked order ${r.order} · ${r.customer}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><strong>Request amount:</strong> ${peso(r.amount)}<br><strong>Reason:</strong> ${r.reason}</div><div class="field"><label>Decision</label><select id="refundDecision"><option>Approved</option><option>Rejected</option></select></div><div class="field"><label>Staff note (optional)</label><textarea id="refundNote" rows="2" placeholder="Add a note for the record"></textarea></div><div class="modal-actions"><button class="button secondary" onclick="closeModal()">Cancel</button><button class="button" onclick="saveRefund('${id}')">Record decision</button></div>`)}
function saveRefund(id){let r=refunds.find(x=>x.id===id);r.status=document.getElementById('refundDecision').value;let note=document.getElementById('refundNote').value;if(note)r.reason+=' · '+note;save();closeModal();render();showToast('Refund decision recorded')}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show')}function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function filterProducts(q){let cat=document.querySelector('.filters select')?.value||'All categories';let arr=products.filter(p=>(cat==='All categories'||p.category===cat)&&`${p.name} ${p.category}`.toLowerCase().includes(q.toLowerCase()));document.getElementById('productsGrid').innerHTML=arr.map(p=>productCard(p)).join('')||'<div class="empty">No matching products.</div>'}
function filterCategory(c){let q=document.querySelector('.filters .search')?.value||'';filterProducts(q)}
function filterTable(q,id){let wrap=document.getElementById(id);if(!wrap)return;wrap.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function orderFilter(f,b){document.querySelectorAll('.filters .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');let arr=f==='All'?orders:orders.filter(o=>o.status===f);document.getElementById('ordersTable').innerHTML=orderTable(arr,true)}
function downloadReport(){let lines=[['Order ID','Customer','Items','Date','Total','Status','Payment'],...orders.map(o=>[o.id,o.customer,o.items,o.date,o.total,o.status,o.payment])];let csv=lines.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MercaHub_Order_Report.csv';a.click();URL.revokeObjectURL(a.href);showToast('CSV report downloaded')}
function render(){document.body.classList.toggle('customer-mode',role==='customer');if(role==='customer'){document.getElementById('app').innerHTML=customer();return}let views={dashboard,products:productsPage,monitoring,sales,orders:ordersPage,cancellations:cancelPage,refunds:refundsPage,finance,reports};document.getElementById('app').innerHTML=shell((views[page]||dashboard)())}
render();
</script>
</body>
</html>
